<div class="container py-4">
  <div class="row">
    <div class="col-lg-3 mb-4 mb-lg-0">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center p-4">
          <div class="profile-avatar mb-3">
            <div class="avatar-circle">
              {{ getUserInitials(currentUser) }}
            </div>
          </div>
        </div>
      </div>

      <div class="list-group mt-4 sidebar-nav">
        <a href="#profile" class="list-group-item list-group-item-action active">
          <i class="bi bi-person me-2"></i> Profile
        </a>
        <a href="#security" class="list-group-item list-group-item-action">
          <i class="bi bi-shield-lock me-2"></i> Security
        </a>
        <a routerLink="/dashboard" class="list-group-item list-group-item-action">
          <i class="bi bi-archive me-2"></i> My Archives
        </a>
        <a href="#" class="list-group-item list-group-item-action text-danger">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </a>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0">Profile Information</h5>
        </div>
        <div class="card-body p-4">
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
            <!-- Profile Picture Section -->
            <div class="text-center mb-4">
              <div class="profile-pic-preview mb-2 d-flex justify-content-center">
                <ng-container *ngIf="profileImagePreview; else defaultImage">
                  <img [src]="profileImagePreview" alt="Profile Preview" class="rounded-circle img-fluid" style="max-width: 150px; height: auto;">
                </ng-container>
                <ng-template #defaultImage>
                  <i class="fas fa-user-circle" style="font-size: 80px; color: #ccc;"></i>
                </ng-template>
              </div>
              <div>
                <input
                  type="file"
                  id="profilePic"
                  class="form-control"
                  (change)="onProfileImageSelected($event)"
                  accept="image/*"
                />
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" formControlName="firstName" id="firstName" [ngClass]="{'is-invalid': submitted && f['firstName'].errors}">
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" formControlName="lastName" id="lastName" [ngClass]="{'is-invalid': submitted && f['lastName'].errors}">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email" id="email" [ngClass]="{'is-invalid': submitted && f['email'].errors}">
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" formControlName="phoneNumber" id="phone">
              </div>
            </div>

            <div class="mb-3">
              <label for="address" class="form-label">Address</label>
              <input type="text" class="form-control" formControlName="address" id="address">
            </div>

            <div class="d-flex justify-content-end">
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Update
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Usage Stats -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0">Usage Statistics</h5>
        </div>
        <div class="card-body p-4">
          <div class="row g-4">
            <div class="col-md-4">
              <h2 class="text-primary">28</h2>
              <p class="text-muted mb-0">Total Archives</p>
            </div>
            <div class="col-md-4">
              <h2 class="text-primary">4.2 GB</h2>
              <p class="text-muted mb-0">Space Saved</p>
            </div>
            <div class="col-md-4">
              <h2 class="text-primary">72%</h2>
              <p class="text-muted mb-0">Average Compression</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Account Settings -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0">Account Settings</h5>
        </div>
        <div class="card-body p-4">
          <h6 class="mb-3">Danger Zone</h6>
          <div class="alert alert-danger d-flex justify-content-between align-items-center">
            <div>
              <h6 class="alert-heading mb-1">Delete Account</h6>
              <p class="mb-0 small">This will permanently delete your account and all your archives</p>
            </div>
            <button type="button" class="btn btn-outline-danger">Delete Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
